name: mitoloop_v0
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - matplotlib
  - h5py
  - cooler            # .cool / .mcool
  - requests          # gtex_eqtl.py fetch
  - python-pptx       # svg_to_pptx.py
  - pysam             # promoter_features.py (bgzipped FASTA)
  - xlrd              # regulome.py, MitoCarta3.0 .xls
  - openpyxl          # jiang2020_tables.py, Jiang 2020 .xlsx
  - pybigwig          # phyloP, read by the reannot package built with this environment
  - libcurl           # hic-straw is built from source
  - cxx-compiler
  - pybind11
  - pip
  - pip:
      - hic-straw     # .hic, local file or URL
